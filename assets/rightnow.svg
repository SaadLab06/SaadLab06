="1.5"/><circle cx="44.5" cy="153" r="2" fill="#f0282d"/></g><g class="rise" style="animation-delay:0.72s"><text class="mono k" x="68" y="158" font-size="11" fill="#f0282d">RUNNING</text><text x="190" y="158" font-size="15" font-weight="600" fill="#f2f2f4">A home server with self-hosted n8n and Coolify</text><text x="190" y="178" font-size="13" fill="#8a8a96">My own automations live there, with an outside check watching the uptime.</text></g><g class="pop" style="animation-delay:0.94s"><circle class="ring" cx="44.5" cy="211" r="5" fill="none" stroke="#f0282d" stroke-width="1.5"/><circle cx="44.5" cy="211" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/><circle cx="44.5" cy="211" r="2" fill="#f0282d"/></g><g class="rise" style="animation-delay:0.94s"><text class="mono k" x="68" y="216" font-size="11" fill="#f0282d">TINKERING</text><text x="190" y="216" font-size="15" font-weight="600" fill="#f2f2f4">Local AI models, 3D scenes in Blender, motion graphics in code</text><text x="190" y="236" font-size="13" fill="#8a8a96">Where I try new tools before they reach client work.</text></g><g class="pk" style="animation:fall 5s linear infinite"><circle cx="44.5" cy="0" r="7" fill="#f0282d" fill-opacity=".22"/><circle cx="44.5" cy="0" r="3" fill="#f0282d"/></g></g><rect x=".5" y=".5" width="879" height="265" rx="13.5" fill="none" stroke="#1d1d25"/></svg>