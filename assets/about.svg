<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 478" width="880" height="478" role="img" aria-label="About me: an engineer from Oran, Algeria, from industrial maintenance to production AI systems."><title>About me: an engineer from Oran, Algeria, from industrial maintenance to production AI systems.</title><style>
text{font-family:'Inter Tight',Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.k{font-weight:700;letter-spacing:1.5px}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes on{from{fill-opacity:0}}
@keyframes letter{0%{stroke-opacity:1;stroke-dashoffset:1;fill-opacity:0}60%{stroke-opacity:1;stroke-dashoffset:0;fill-opacity:0}100%{stroke-opacity:0;stroke-dashoffset:0;fill-opacity:1}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
@keyframes blink{50%{opacity:.2}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes sel{0%{opacity:0}8%,86%{opacity:1}100%{opacity:0}}
@keyframes hit{0%,14%{fill:#f0282d;stroke:#f0282d}40%,100%{fill:#09090c;stroke:#3a3a46}}
@keyframes boxhit{0%,16%{stroke:#f0282d}45%,100%{stroke:#1d1d25}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .7s ease both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.c{animation:on 1ms both}
.lt{stroke:#0d99ff;stroke-width:1.4;stroke-dasharray:1;stroke-opacity:0;animation:letter 1.1s cubic-bezier(.65,0,.35,1) both}
.rail{transform-box:fill-box;transform-origin:top;animation:grow .9s cubic-bezier(.65,0,.35,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.blink{animation:blink 1.6s ease-in-out infinite}
.bob{animation:bob 3.6s ease-in-out infinite}
.sel{opacity:0;animation:sel 2s linear both}
.hit{fill:#09090c;stroke:#3a3a46;animation:hit 5s linear infinite}
.boxhit{animation:boxhit 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.agent,.pk{display:none}}
@keyframes fall{0%{transform:translateY(0);opacity:0}6%,94%{opacity:1}100%{transform:translateY(478px);opacity:0}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern><clipPath id="clip"><rect width="880" height="478" rx="14"/></clipPath></defs><g clip-path="url(#clip)"><rect width="880" height="478" fill="#09090c"/><rect width="880" height="478" fill="url(#dots)"/><rect class="rail" x="44" y="0" width="1" height="478" fill="#f0282d" fill-opacity=".7"/><g class="pop" style="animation-delay:0.2s"><circle cx="44.5" cy="46" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/></g><path class="rise" style="animation-delay:0.2s" fill="#f0282d" d="M72.9 54.2Q70.8 54.2 69.6 52.9Q68.4 51.7 68.4 49.4V41.7Q68.4 39.2 69.5 38Q70.6 36.7 72.9 36.7Q75.2 36.7 76.4 38Q77.5 39.2 77.5 41.7V49.4Q77.5 51.7 76.3 52.9Q75.1 54.2 72.9 54.2ZM72.9 51Q73.3 51 73.6 50.6Q73.8 50.3 73.8 49.8V41.3Q73.8 40.7 73.7 40.3Q73.5 39.8 72.9 39.8Q72.4 39.8 72.2 40.3Q72.1 40.7 72.1 41.3V49.8Q72.1 50.3 72.3 50.6Q72.6 51 72.9 51ZM80.3 54V40.8Q79.9 41.2 79.3 41.4Q78.7 41.7 78.1 41.7V39Q78.6 38.9 79.2 38.6Q79.8 38.4 80.3 37.9Q80.9 37.4 81.1 36.8H83.9V54Z"/><path class="rise" style="animation-delay:0.25s" fill="#55555f" d="M93.8 54 97.8 36.7H101.3L97.3 54Z"/><path class="rise" style="animation-delay:0.3s" fill="#f2f2f4" d="M110.9 54 112.6 36.8H118.4L120 54H116.8L116.5 51.2H114.4L114.2 54ZM114.7 48.5H116.3L115.5 39.7H115.3ZM121.1 54V36.8H125.7Q127.6 36.8 128.5 37.7Q129.3 38.6 129.3 40.7V41.5Q129.3 42.7 128.9 43.5Q128.4 44.2 127.6 44.4Q128.7 44.7 129.1 45.8Q129.5 46.9 129.5 48.4Q129.5 50.1 129.2 51.4Q128.9 52.6 128.1 53.3Q127.2 54 125.7 54ZM124.4 43.3H125.1Q125.6 43.3 125.7 42.9Q125.9 42.5 125.9 42V40.3Q125.9 39.5 125.2 39.5H124.4ZM124.8 51Q126.1 51 126.1 49.7V47.6Q126.1 46.8 125.9 46.4Q125.7 46 125.1 46H124.4V51Q124.6 51 124.8 51ZM134.7 54.2Q132.7 54.2 131.6 52.9Q130.5 51.7 130.5 49.3V41.1Q130.5 38.9 131.6 37.8Q132.7 36.7 134.7 36.7Q136.8 36.7 137.9 37.8Q139 38.9 139 41.1V49.3Q139 51.7 137.9 52.9Q136.8 54.2 134.7 54.2ZM134.8 51Q135.6 51 135.6 49.5V41.1Q135.6 39.8 134.8 39.8Q133.9 39.8 133.9 41.1V49.5Q133.9 50.3 134.1 50.6Q134.3 51 134.8 51ZM144.3 54.2Q142.2 54.2 141.2 53Q140.2 51.7 140.2 49.4V36.8H143.5V49.3Q143.5 49.7 143.5 50.1Q143.6 50.5 143.8 50.7Q143.9 51 144.3 51Q144.7 51 144.9 50.7Q145.1 50.5 145.1 50.1Q145.2 49.7 145.2 49.3V36.8H148.5V49.4Q148.5 51.7 147.5 53Q146.5 54.2 144.3 54.2ZM151.3 54V40.1H149.3V36.8H156.8V40.1H154.8V54ZM162.4 54V36.8H167.7L169.1 47.3L170.6 36.8H175.8V54H172.7V41.6L170.7 54H167.6L165.5 41.6V54ZM177.4 54V36.8H184.2V40.1H180.9V43.5H184.1V46.7H180.9V50.7H184.5V54Z"/><text x="68" y="96" font-size="15" fill="#f2f2f4" class="rise" style="animation-delay:0.4s" opacity=".88">I am Saad, an engineer from Oran, Algeria. I trained in industrial maintenance, where you assume</text><text x="68" y="118" font-size="15" fill="#f2f2f4" class="rise" style="animation-delay:0.5s" opacity=".88">the machine will fail and plan for it. Today I build AI agents, automation pipelines and full web</text><text x="68" y="140" font-size="15" fill="#f2f2f4" class="rise" style="animation-delay:0.6000000000000001s" opacity=".88">apps the same way. I design what I build, and I work in English, French and Arabic.</text><g class="pop" style="animation-delay:0.7s"><circle cx="44.5" cy="191" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/></g><g class="rise" style="animation-delay:0.70s"><text class="mono k" x="68" y="196" font-size="11" fill="#8a8a96">DEGREE</text><text x="190" y="196" font-size="15" font-weight="600" fill="#f2f2f4">Industrial maintenance and safety engineering</text><text x="190" y="216" font-size="13" fill="#8a8a96">Planning for failure became a habit. Final project: predictive maintenance on vibration data.</text></g><g class="pop" style="animation-delay:0.9199999999999999s"><circle cx="44.5" cy="249" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/></g><g class="rise" style="animation-delay:0.92s"><text class="mono k" x="68" y="254" font-size="11" fill="#8a8a96">2024</text><text x="190" y="254" font-size="15" font-weight="600" fill="#f2f2f4">Freelance for French and Maghreb businesses</text><text x="190" y="274" font-size="13" fill="#8a8a96">Agents that write to live order systems, each behind a validator and a confirmation step.</text></g><g class="pop" style="animation-delay:1.14s"><circle cx="44.5" cy="307" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/></g><g class="rise" style="animation-delay:1.14s"><text class="mono k" x="68" y="312" font-size="11" fill="#8a8a96">2025</text><text x="190" y="312" font-size="15" font-weight="600" fill="#f2f2f4">A procurement engine for a public transport operator</text><text x="190" y="332" font-size="13" fill="#8a8a96">Supplier quotes in, a scored recommendation out. Matching went from hours to seconds.</text></g><g class="pop" style="animation-delay:1.3599999999999999s"><circle cx="44.5" cy="365" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/></g><g class="rise" style="animation-delay:1.36s"><text class="mono k" x="68" y="370" font-size="11" fill="#8a8a96">2025 / 2026</text><text x="190" y="370" font-size="15" font-weight="600" fill="#f2f2f4">The AI layer for four businesses under one owner</text><text x="190" y="390" font-size="13" fill="#8a8a96">Use case selection, build, deployment, and the method their staff follow afterwards.</text></g><g class="pop" style="animation-delay:1.58s"><circle class="ring" cx="44.5" cy="423" r="5" fill="none" stroke="#f0282d" stroke-width="1.5"/><circle cx="44.5" cy="423" r="5" fill="#09090c" stroke="#f0282d" stroke-width="1.5"/><circle cx="44.5" cy="423" r="2" fill="#f0282d"/></g><g class="rise" style="animation-delay:1.58s"><text class="mono k" x="68" y="428" font-size="11" fill="#f0282d">NOW</text><text x="190" y="428" font-size="15" font-weight="600" fill="#f2f2f4">Agents, pipelines and internal platforms, built solo</text><text x="190" y="448" font-size="13" fill="#8a8a96">For teams in Europe, North Africa and the US. Client names stay private.</text></g><g class="pk" style="animation:fall 6s linear infinite"><circle cx="44.5" cy="0" r="7" fill="#f0282d" fill-opacity=".22"/><circle cx="44.5" cy="0" r="3" fill="#f0282d"/></g></g><rect x=".5" y=".5" width="879" height="477" rx="13.5" fill="none" stroke="#1d1d25"/></svg>